<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="ภาพ isometric นักศึกษาทำงานกับผู้ช่วย AI">
<title>ผลลัพธ์ภาพจากพรอมป์ few-shot: AI ช่วยมนุษย์เรียนรู้</title>
<desc>ภาพ isometric นักศึกษาทำงานกับผู้ช่วย AI โทนส้มเบิร์นต์ตัดน้ำเงินปิโตรลบนพื้นครีม พร้อมโหนดโครงข่ายประสาทเทียม</desc>
                    <defs>
                      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#fbf4ec"/><stop offset="1" stop-color="#f3e7db"/>
                      </linearGradient>
                      <linearGradient id="brain" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#ff8355"/><stop offset="1" stop-color="#d9480f"/>
                      </linearGradient>
                    </defs>
                    <rect width="640" height="320" fill="url(#sky)"/>
                    <!-- ground platform (iso) -->
                    <polygon points="320,120 560,235 320,300 80,235" fill="#dbe9ee"/>
                    <polygon points="80,235 320,300 320,320 80,255" fill="#c3dbe3"/>
                    <polygon points="560,235 320,300 320,320 560,255" fill="#b3d0da"/>
                    <!-- network nodes -->
                    <g stroke="#1e5566" stroke-width="1.6" opacity=".55">
                      <line x1="430" y1="90" x2="500" y2="140"/><line x1="500" y1="140" x2="470" y2="200"/>
                      <line x1="430" y1="90" x2="470" y2="200"/><line x1="500" y1="140" x2="545" y2="110"/>
                      <line x1="150" y1="120" x2="120" y2="185"/><line x1="150" y1="120" x2="205" y2="150"/>
                    </g>
                    <g fill="#1e5566">
                      <circle cx="430" cy="90" r="6"/><circle cx="500" cy="140" r="7"/><circle cx="470" cy="200" r="5"/>
                      <circle cx="545" cy="110" r="5"/><circle cx="150" cy="120" r="6"/><circle cx="120" cy="185" r="5"/><circle cx="205" cy="150" r="4"/>
                    </g>
                    <!-- glowing brain -->
                    <circle cx="380" cy="150" r="52" fill="#d9480f" opacity=".16"/>
                    <path d="M356 150 q-16 -30 16 -34 q10 -16 30 -8 q22 -4 22 20 q16 8 4 28 q4 22 -22 20 q-14 14 -30 2 q-24 4 -20 -22 q-8 -10 0 -24 z" fill="url(#brain)"/>
                    <g stroke="#fff" stroke-width="1.4" opacity=".8" fill="none">
                      <path d="M380 120 v58 M366 134 q14 8 28 0 M366 166 q14 -8 28 0"/>
                    </g>
                    <!-- student -->
                    <g>
                      <rect x="205" y="175" width="70" height="44" rx="6" fill="#1e5566"/>
                      <rect x="212" y="150" width="30" height="30" rx="6" fill="#e8b58a"/>
                      <circle cx="227" cy="140" r="15" fill="#3a2a22"/>
                      <rect x="250" y="205" width="120" height="8" rx="4" fill="#a7754f"/>
                    </g>
                    <!-- floating icons -->
                    <g>
                      <rect x="470" y="60" width="30" height="24" rx="4" fill="#fff" stroke="#d9480f" stroke-width="2"/>
                      <line x1="476" y1="70" x2="494" y2="70" stroke="#d9480f" stroke-width="2"/><line x1="476" y1="76" x2="490" y2="76" stroke="#d9480f" stroke-width="2"/>
                      <g transform="translate(120,70)"><rect width="34" height="26" rx="4" fill="#fff" stroke="#1e5566" stroke-width="2"/>
                        <polyline points="5,20 13,12 20,17 29,6" fill="none" stroke="#1e5566" stroke-width="2"/></g>
                    </g>
                    <text x="320" y="34" text-anchor="middle" font-family="'Chakra Petch',sans-serif" font-size="21" font-weight="700" fill="#1a1c22">AI ช่วยมนุษย์เรียนรู้</text>
                  </svg>
