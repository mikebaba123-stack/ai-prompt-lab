<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สไลด์สรุป 30 หน้า · ห้องทดลองพรอมป์ AI</title>
<meta name="description" content="สไลด์สรุปการฝึกเขียน Prompt 6 แง่ × 5 ขั้น หัวข้อปัญญาประดิษฐ์ วิชา GE931-1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* ธีม Nival — ice / glass */
  --cream:#E9F1FA; --ink:#06192F; --muted:#4D6076; --line:rgba(6,25,47,.13);
  --accent:#1169DC; --accent-soft:#E3EEFB; --petrol:#0B3A63; --petrol-soft:#DCE9F8;
  --purple:#6F4FF2; --card:rgba(255,255,255,.66); --code-bg:#06192F; --code-ink:#E7F0F8;
  --glass-line:rgba(255,255,255,.62);
  --font-display:'Inter','IBM Plex Sans Thai',sans-serif;
  --font-body:'Inter','IBM Plex Sans Thai',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(circle at 50% 0,#12395F,#0B2036 60%,#071829) fixed,#0B2036;
  font-family:var(--font-body);color:var(--ink);-webkit-font-smoothing:antialiased}

.bar{position:fixed;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:rgba(6,25,47,.88);color:#E7F0F8;z-index:50;font-size:14px;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.bar .t{font-family:var(--font-display);font-weight:700;letter-spacing:.2px}
.bar .t small{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;opacity:.6;letter-spacing:.06em}
.bar .sp{flex:1}
.bar button,.bar a.btn{font:inherit;font-size:13px;color:#E7F0F8;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:8px;padding:6px 11px;cursor:pointer;text-decoration:none}
.bar button:hover,.bar a.btn:hover{background:rgba(255,255,255,.2)}
.bar .pos{font-family:var(--font-mono);font-size:13px;opacity:.85;min-width:74px;text-align:center}

.stage{padding:76px 16px 92px;display:flex;justify-content:center}
.slide{display:none;width:min(1120px,100%);aspect-ratio:16/9;
  background:radial-gradient(circle at 42% 16%,rgba(246,251,255,.9),transparent 34%),
             linear-gradient(140deg,#EDF4FC,#E4EEF8 58%,#DCE9F6);
  border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(4,16,31,.45);position:relative}
.slide.on{display:block}
.inner{position:absolute;inset:0;padding:38px 46px 46px;display:flex;flex-direction:column}

.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.asp{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--petrol);background:var(--petrol-soft);padding:4px 9px;border-radius:999px}
.stepchip{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;padding:4px 9px;border-radius:999px;
  background:rgba(231,238,246,.85);color:var(--muted)}
.stepchip.z{background:rgba(231,238,246,.85);color:#5E7386}
.stepchip.f{background:var(--accent-soft);color:#0B4DA8}
.stepchip.r{background:var(--petrol-soft);color:var(--petrol)}
h2.st{font-family:var(--font-display);font-weight:600;letter-spacing:-.018em;font-size:clamp(22px,2.5vw,34px);margin:0 0 6px;line-height:1.18}
p.sub{margin:0 0 14px;color:var(--muted);font-size:clamp(13px,1.25vw,16px);line-height:1.6;max-width:70ch}
.body{flex:1;min-height:0;display:flex;gap:22px}
.body.col{flex-direction:column}
.grow{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;gap:0}

pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:16px 18px;
  font-family:var(--font-mono);font-size:clamp(11px,1.15vw,14.5px);line-height:1.62;overflow:auto;white-space:pre-wrap;
  max-height:100%}
pre.code .cm{color:#8c9ba8}
pre.code .hl{color:#ffb38a}

.note{background:var(--card);border:1px solid var(--glass-line);border-left:4px solid var(--accent);
  border-radius:14px;padding:12px 15px;font-size:clamp(12px,1.15vw,15px);line-height:1.62;color:#33465B;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.note b{color:var(--accent)}
.note.p{border-left-color:var(--petrol)}
.note.p b{color:var(--petrol)}

ul.pts{margin:0;padding-left:1.15em;font-size:clamp(12.5px,1.2vw,16px);line-height:1.75;color:#33465B}
ul.pts li{margin:.18em 0}
ul.pts li b{color:var(--ink)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0}
.card{background:var(--card);border:1px solid var(--glass-line);border-radius:16px;padding:14px 16px;
  min-height:0;overflow:auto;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:inset 0 0 18px rgba(255,255,255,.4)}
.card .ch{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;margin-bottom:8px;color:var(--muted)}
.card.before{background:rgba(231,238,246,.8)}.card.before .ch{color:#5E7386}
.card.after{background:rgba(227,238,251,.9);border-color:#C9DEF6}.card.after .ch{color:#0B4DA8}
.card ul{margin:0;padding-left:1.1em;font-size:clamp(12px,1.12vw,14.5px);line-height:1.7}

figure{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;flex:1}
figure img,figure svg{max-width:100%;max-height:100%;border-radius:14px;border:1px solid var(--glass-line);
  background:rgba(255,255,255,.7)}
figcaption{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.mermaid{display:flex;justify-content:center;align-items:center;min-height:0;flex:1}
.mermaid svg{max-height:100%;height:auto}
.math{background:var(--card);border:1px solid var(--glass-line);border-radius:16px;padding:10px 16px;text-align:center;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  font-size:clamp(11px,1.05vw,14px)}
.math .cap{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.09em;color:var(--muted);margin-bottom:2px}
a.lnk{color:var(--petrol);font-weight:500}
.sfoot{position:absolute;left:46px;right:46px;bottom:16px;display:flex;justify-content:space-between;
  align-items:center;font-family:var(--font-mono);font-size:11px;color:#9a9ca4;border-top:1px solid var(--line);padding-top:8px}

/* cover */
.cover{background:radial-gradient(circle at 58% 14%,rgba(250,253,255,.95),transparent 32%),
  linear-gradient(160deg,#F3F9FF 0%,#E4EEF8 55%,#D6E6F5 100%)}
.cover .inner{justify-content:center}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.cover h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.2vw,58px);line-height:1.1;margin:.28em 0 .2em}
.cover h1 em{font-style:normal;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{background:rgba(255,255,255,.66);border:1px solid var(--glass-line);border-radius:999px;padding:6px 12px;
  font-size:12.5px;color:var(--muted);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.chip b{color:var(--ink)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px}
.g5{background:rgba(255,255,255,.72);border:1px solid var(--glass-line);border-radius:14px;padding:10px 11px}
.g5 .n{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);letter-spacing:.1em}
.g5 .l{font-size:12.5px;margin-top:3px;line-height:1.45}

.dots{position:fixed;left:0;right:0;bottom:0;background:rgba(6,25,47,.88);padding:10px 16px;z-index:50;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:rgba(231,240,248,.34);cursor:pointer;padding:0}
.dots button.on{background:var(--accent);transform:scale(1.35)}
.hint{position:fixed;right:14px;bottom:52px;color:#8FA9C2;font-family:var(--font-mono);font-size:11px;z-index:40}

@media (max-width:760px){
  .inner{padding:22px 20px 34px}
  .body{flex-direction:column;gap:12px}
  .two{grid-template-columns:1fr}
  .slide{aspect-ratio:auto;min-height:74vh}
  .sfoot{left:20px;right:20px}
}

@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff}
  .bar,.dots,.hint{display:none!important}
  .stage{padding:0;display:block}
  .slide{display:block!important;width:100%;aspect-ratio:16/9;box-shadow:none;border-radius:0;
    break-after:page;page-break-after:always;border:0;margin:0 0 4mm}
  .slide:last-child{break-after:auto;page-break-after:auto}
  pre.code{background:#EDF4FC;color:#06192F;border:1px solid var(--line)}
}
</style>
</head>

  body:'<div class="grow"><pre class="code">สร้างเว็บไซต์หน้าเดียว (index.html) ภาษาไทย หัวข้อ "ปัญญาประดิษฐ์"\nเพื่อ deploy บน GitHub Pages โดย:\n- รวมผลงาน 6 แง่ (รูป AI, กราฟ Desmos, ไดอะแกรม Mermaid,\n  บทความ LaTeX, สไลด์สรุป, ตัวเว็บเอง) ให้ต่อเนื่องเป็นเรื่องเดียว\n- แต่ละแง่แสดง 5 ขั้น: พรอมป์แรก → ผล → พรอมป์ใหม่ → ผล → บทสะท้อน\n- ดีไซน์ธีม "สมุดบันทึกการทดลอง" มีสารบัญ, สลับโหมดสว่าง/มืด\n- ฝัง Mermaid และสมการ (MathJax) ให้เรนเดอร์ในหน้าได้จริง\n- responsive รองรับมือถือ และเป็นไฟล์เดียวจบ ไม่พึ่งไฟล์ภายนอก</pre></div>'},

/* ---------- build slides ---------- */
var stage=document.getElementById('stage');
var list=[];

function el(html){var d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}

/* cover */
list.push(el('<section class="slide cover"><div class="inner">'+
  '<div class="eyebrow">GE931-1 · ปีการศึกษา 2569 ภาคเรียนที่ 1</div>'+
  '<h1>ฝึกใช้ <em>Prompt</em> ใน 6 เครื่องมือ<br>ผ่านหัวข้อ <em>ปัญญาประดิษฐ์</em></h1>'+
  '<p class="sub">เปรียบเทียบผลลัพธ์จากพรอมป์แบบ Zero-shot (สั่งลอย ๆ) กับ Few-shot (ใส่บริบท ตัวอย่าง และข้อกำหนด) — 6 แง่ × 5 ขั้น = 30 หน้า</p>'+
  '<div class="chips"><span class="chip">Keyword <b>ปัญญาประดิษฐ์ (AI)</b></span>'+
  '<span class="chip">ผู้จัดทำ <b>G</b></span>'+
  '<span class="chip">เว็บไซต์ <b>mikebaba123-stack.github.io/ai-prompt-lab</b></span></div>'+
  '<div class="grid5">'+
  '<div class="g5"><div class="n">ขั้น 1</div><div class="l">พรอมป์แรก<br>zero-shot</div></div>'+
  '<div class="g5"><div class="n">ขั้น 2</div><div class="l">ผลลัพธ์<br>ครั้งที่ 1</div></div>'+
  '<div class="g5"><div class="n">ขั้น 3</div><div class="l">พรอมป์ใหม่<br>few-shot</div></div>'+
  '<div class="g5"><div class="n">ขั้น 4</div><div class="l">ผลลัพธ์<br>ครั้งที่ 2</div></div>'+
  '<div class="g5"><div class="n">ขั้น 5</div><div class="l">บทสะท้อน<br>การเรียนรู้</div></div>'+
  '</div></div></section>'));

var pageNo=0;
ASPECTS.forEach(function(a){
  C[a.n].forEach(function(s,si){
    pageNo++;
    var st=STEP[si];
    var sec=el('<section class="slide"><div class="inner">'+
      '<div class="shead"><span class="asp">'+a.tag+' · '+a.name+'</span>'+
      '<span class="stepchip '+st.k+'">'+st.l+'</span></div>'+
      '<h2 class="st">'+s.h+'</h2>'+
      (s.sub?'<p class="sub">'+s.sub+'</p>':'')+
      '<div class="body'+(s.body.indexOf('class="two"')>=0||s.body.indexOf('class="grow"')>=0||s.body.indexOf('body col')>=0?' col':'')+'">'+s.body+'</div>'+
      '<div class="sfoot"><span>'+a.tool+'</span><span>หน้า '+pageNo+' / 30</span></div>'+
      '</div></section>');
    list.push(sec);
  });
});

/* closing */
list.push(el('<section class="slide"><div class="inner">'+
  '<div class="shead"><span class="asp">สรุปภาพรวม</span><span class="stepchip r">5 หลักการที่ได้จากทั้ง 6 แง่</span></div>'+
  '<h2 class="st">อะไรทำให้ Zero-shot กับ Few-shot ต่างกัน</h2>'+
  '<p class="sub">ทั้ง 6 การทดลองชี้ตรงกันว่า ผลลัพธ์ไม่ได้ขึ้นกับ “เครื่องมือ” อย่างเดียว แต่ขึ้นกับ “คุณภาพของพรอมป์” มากกว่า</p>'+
  '<div class="body col" style="gap:10px">'+
  '<ul class="pts">'+
  '<li><b>1 · ให้บริบท (Context)</b> — บอกว่าใครใช้ ใช้ทำอะไร ในสถานการณ์ไหน</li>'+
  '<li><b>2 · เจาะจง (Specificity)</b> — ระบุประธาน ตัวแปร สไตล์ ขั้นตอน แทนคำกว้าง ๆ อย่าง “เกี่ยวกับ AI”</li>'+
  '<li><b>3 · กำหนดรูปแบบผลลัพธ์ (Format)</b> — 6 สไลด์, flowchart แนวตั้ง, สมการเลขที่, ไฟล์ .tex</li>'+
  '<li><b>4 · ยกตัวอย่าง + ข้อจำกัด</b> — ใส่ตัวอย่างและ “สิ่งที่ไม่ต้องการ” (negative prompt)</li>'+
  '<li><b>5 · ทำซ้ำและปรับ (Iterate)</b> — พรอมป์แรกคือจุดเริ่ม few-shot คือผลของการวนปรับ</li>'+
  '</ul>'+
  '<div class="note"><b>ข้อสรุป:</b> เขียนพรอมป์เหมือนสั่งงานเพื่อนร่วมทีม — ยิ่งสื่อสารชัด ผลลัพธ์ยิ่งใกล้สิ่งที่คิดไว้ และประหยัดรอบการแก้</div>'+
  '<div class="note p"><b>ผลงานต่อยอด:</b> หน้า <b>Nival — Cyberspace Identity</b> นำภาพ AI จากแง่ที่ 1 มาทำเป็นเว็บไซต์จริงตามแง่ที่ 6 (spotlight reveal ตามเคอร์เซอร์) → <span style="font-family:var(--font-mono);font-size:12px">/ai-prompt-lab/nival/</span></div></div>'+
  '<div class="sfoot"><span>ห้องทดลองพรอมป์ AI · GE931-1</span><span>สรุป</span></div>'+
  '</div></section>'));

list.forEach(function(s){stage.appendChild(s);});

/* ---------- navigation ---------- */
var i=0,n=list.length;
var pos=document.getElementById('pos'), dots=document.getElementById('dots');
list.forEach(function(_,k){
  var b=document.createElement('button');
  b.setAttribute('aria-label','ไปหน้า '+(k+1));
  b.addEventListener('click',function(){go(k);});
  dots.appendChild(b);
});
var dotEls=Array.prototype.slice.call(dots.children);
function go(k){
  i=(k+n)%n;
  list.forEach(function(s,x){s.classList.toggle('on',x===i);});
  dotEls.forEach(function(d,x){d.classList.toggle('on',x===i);});
  pos.textContent=(i+1)+' / '+n;
  try{location.hash='p'+(i+1);}catch(e){}
}
document.getElementById('btnPrev').addEventListener('click',function(){go(i-1);});
document.getElementById('btnNext').addEventListener('click',function(){go(i+1);});
document.getElementById('btnPrint').addEventListener('click',function(){window.print();});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){go(i+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(i-1);e.preventDefault();}
  else if(e.key==='Home'){go(0);}
  else if(e.key==='End'){go(n-1);}
  else if(e.key==='p'||e.key==='P'){window.print();}
});
var m=/^#p(\d+)$/.exec(location.hash||'');
go(m?parseInt(m[1],10)-1:0);

/* mermaid */
try{
  if(window.mermaid){
    mermaid.initialize({startOnLoad:true,theme:'base',securityLevel:'loose',
      themeVariables:{primaryColor:'#E3EEFB',primaryBorderColor:'#1169DC',primaryTextColor:'#06192F',
        lineColor:'#47596E',secondaryColor:'#DCE9F8',tertiaryColor:'#F3F9FF',fontSize:'14px'},
      flowchart:{curve:'basis',useMaxWidth:true},fontFamily:"'Inter','IBM Plex Sans Thai',sans-serif"});
  }
}catch(e){}

/* แสดงทุกหน้าเมื่อสั่งพิมพ์ (CSS จัดการอยู่แล้ว แต่ต้องคืนสถานะหลังพิมพ์) */
window.addEventListener('afterprint',function(){go(i);});
})();
</script>
</body>
</html>
